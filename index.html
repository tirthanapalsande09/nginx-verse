
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nginx-Verse</title>
  <style>
    body {
      margin: 0;
      background: #141414;
      color: white;
      font-family: Arial, sans-serif;
    }
    nav {
      background: #080808;
      padding: 20px 35px;
      color: #e50914;
      font-size: 25px;
      font-weight: bold;
    }
    .hero {
      padding: 80px 35px;
      background: linear-gradient(90deg, #350707, #141414);
    }
    h1 { font-size: 42px; }
    button {
      background: #e50914;
      color: white;
      padding: 12px 24px;
      border: 0;
      cursor: pointer;
    }
    .movies {
      display: flex;
      gap: 15px;
      padding: 20px 35px;
      flex-wrap: wrap;
    }
    .movie {
      background: #292929;
      padding: 35px 20px;
      flex: 1;
      min-width: 140px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <nav>NGINX-VERSE</nav>
  <div class="hero">
    <h1>Unlimited Stories.<br>Endless Entertainment.</h1>
    <p>Discover your next favourite movie.</p>
    <button onclick="alert('Welcome to Nginx-Verse!')">
      PLAY NOW
    </button>
  </div>
  <h2 style="padding-left:35px">Trending Now</h2>
  <div class="movies">
    <div class="movie">Action Movies</div>
    <div class="movie">Sci-Fi Stories</div>
    <div class="movie">Trending Shows</div>
  </div>
</body>
</html>
